name: gates
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 is the version the 11x11's 33 numbers were re-derived on; the OCR chain
          # rasterises glyphs (ImageFont), so a different Pillow can change the result.
          python-version: "3.11"

      - name: install dependencies
        # The repository has no requirements.txt yet, but two gates need third-party
        # packages: numpy (src/tiletable.py) and Pillow (the OCR chain that re-derives
        # the 11x11's 33 numbers from the source image).  A clean runner has neither.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: compile every python file
        run: |
          python3 tools/compile_all.py
          echo "all python files compile"

      - name: run the gate suite
        run: python3 tools/run_all_gates.py
